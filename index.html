<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #111111;
    --ink2: #444444;
    --ink3: #888888;
    --accent: #4A90D9;
    --accent-light: #e8f2fc;
    --bg: #fafaf8;
    --white: #ffffff;
    --border: #e8e8e4;
    --radius: 16px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 60px;
    background: rgba(250,250,248,0.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
    font-size: 22px;
    color: var(--ink);
    text-decoration: none;
    letter-spacing: -0.3px;
  }

  .nav-links { display: flex; gap: 36px; align-items: center; }
  .nav-links a {
    text-decoration: none;
    color: var(--ink2);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.3px;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--accent); }

  .nav-cta {
    background: var(--ink) !important;
    color: var(--white) !important;
    padding: 10px 22px;
    border-radius: 100px;
    font-weight: 500 !important;
    transition: background 0.2s, transform 0.15s !important;
  }
  .nav-cta:hover { background: var(--accent) !important; transform: translateY(-1px); }

  /* HERO */
  .hero {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    padding: 120px 60px 80px;
    gap: 80px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .hero-text { animation: fadeUp 0.8s ease both; }

  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 500; letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .hero-eyebrow::before {
    content: '';
    display: block; width: 28px; height: 1.5px;
    background: var(--accent);
  }

  h1 {
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
    font-size: clamp(48px, 5vw, 72px);
    line-height: 1.1;
    letter-spacing: -1px;
    color: var(--ink);
    margin-bottom: 28px;
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .hero-sub {
    font-size: 17px;
    color: var(--ink2);
    font-weight: 300;
    line-height: 1.7;
    max-width: 420px;
    margin-bottom: 44px;
  }

  .hero-actions { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }

  .btn-primary {
    display: inline-block;
    background: var(--ink);
    color: var(--white);
    padding: 16px 32px;
    border-radius: 100px;
    text-decoration: none;
    font-weight: 500;
    font-size: 15px;
    transition: background 0.2s, transform 0.15s;
  }
  .btn-primary:hover { background: var(--accent); transform: translateY(-2px); }

  .btn-ghost {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink2);
    text-decoration: none;
    font-size: 14px;
    font-weight: 400;
    transition: color 0.2s;
  }
  .btn-ghost:hover { color: var(--accent); }
  .btn-ghost::after { content: '→'; transition: transform 0.2s; }
  .btn-ghost:hover::after { transform: translateX(4px); }

  /* PHOTO */
  .hero-visual { animation: fadeUp 0.8s 0.15s ease both; }

  .photo-frame {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin-left: auto;
  }

  .photo-placeholder {
    width: 100%;
    aspect-ratio: 3/4;
    border-radius: 24px;
    background: linear-gradient(135deg, #e8f2fc 0%, #d0e4f7 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    border: 2px dashed #b0ccee;
    position: relative;
    overflow: hidden;
  }

  .photo-placeholder::before {
    content: '';
    position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%234A90D9' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  .photo-real {
    width: 100%;
    aspect-ratio: 3/4;
    border-radius: 24px;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  .photo-icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--white);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    box-shadow: 0 4px 20px rgba(74,144,217,0.15);
  }

  .photo-label {
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
    text-align: center;
    line-height: 1.5;
  }

  .photo-badge {
    position: absolute;
    bottom: -16px; left: -16px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    display: flex; gap: 12px; align-items: center;
  }

  .badge-icon { font-size: 22px; }
  .badge-text { font-size: 13px; color: var(--ink2); }
  .badge-text strong { display: block; color: var(--ink); font-size: 15px; }

  /* STATS */
  .stats-row {
    display: flex; gap: 0;
    max-width: 1200px; margin: 0 auto 0;
    padding: 0 60px 80px;
    border-top: 1px solid var(--border);
  }

  .stat {
    flex: 1;
    padding: 40px 0;
    border-right: 1px solid var(--border);
    padding-right: 40px;
    padding-left: 40px;
  }
  .stat:first-child { padding-left: 0; }
  .stat:last-child { border-right: none; }

  .stat-num {
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
    font-size: 36px;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 6px;
  }
  .stat-num span { color: var(--accent); }
  .stat-label { font-size: 13px; color: var(--ink3); font-weight: 400; }

  /* ABOUT */
  .section {
    max-width: 1200px;
    margin: 0 auto;
    padding: 100px 60px;
  }

  .section-tag {
    font-size: 11px; font-weight: 500; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--accent);
    margin-bottom: 20px;
  }

  h2 {
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
    font-size: clamp(36px, 4vw, 52px);
    line-height: 1.15;
    letter-spacing: -0.5px;
    margin-bottom: 24px;
  }

  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;

/* ============================================================
   🔒  AB HIER NICHTS MEHR ÄNDERN
   Der folgende Code baut die Seite automatisch aus dem
   CONFIG-Objekt oben zusammen.
   ============================================================ */
</script>

<!-- Leere Container, werden per JavaScript befüllt -->
<div id="site-nav"></div>
<div id="site-hero"></div>
<div id="site-stats"></div>
<div id="site-strip-stats"></div>
<div id="site-about"></div>
<div id="site-forwhom"></div>
<div id="site-angebote"></div>
<div id="site-strip-angebote"></div>
<div id="site-stimmen"></div>
<div id="site-faq"></div>
<div id="site-cta"></div>
<div id="site-footer"></div>

<script>
  /* --- CALENDLY: wird erst beim Klick geladen, damit vorher keine Daten uebertragen werden --- */
  var calendlyReady = false;
  function loadCalendly(cb) {
    if (calendlyReady) { cb(); return; }
    var cssEl = document.createElement('link');
    cssEl.rel = 'stylesheet';
    cssEl.href = 'https://assets.calendly.com/assets/external/widget.css';
    document.head.appendChild(cssEl);
    var jsEl = document.createElement('script');
    jsEl.src = 'https://assets.calendly.com/assets/external/widget.js';
    jsEl.onload = function () { calendlyReady = true; cb(); };
    document.head.appendChild(jsEl);
  }
  function openCalendly(e) {
    if (e) e.preventDefault();
    loadCalendly(function () { Calendly.initPopupWidget({ url: CONFIG.calendly }); });
    return false;
  }

  /* --- NAV --- */
  document.getElementById('site-nav').innerHTML = `
    <nav>
      <a class="nav-logo" href="#">${CONFIG.name}</a>
      <div class="nav-links">
        <a href="#" onclick="return openCalendly(event);" class="nav-cta">${CONFIG.nav.cta}</a>
      </div>
    </nav>`;

  /* --- HERO --- */
  document.getElementById('site-hero').innerHTML = `
    <section style="padding-top:0;">
      <div class="hero">
        <div class="hero-text">
          <div class="hero-eyebrow">${CONFIG.hero.eyebrow}</div>
          <h1>${CONFIG.hero.headline1}<br><em>${CONFIG.hero.headline2}</em></h1>
          <p class="hero-sub">${CONFIG.hero.subtext}</p>
          <div class="hero-actions">
            <a href="#" onclick="return openCalendly(event);" class="btn-primary">${CONFIG.hero.btnPrimary}</a>
            <a href="#angebot" class="btn-ghost">${CONFIG.hero.btnSecondary}</a>
          </div>
        </div>
        <div class="hero-visual">
          <div class="photo-frame">
            ${CONFIG.foto
              ? `<img src="${CONFIG.foto}" alt="Foto von ${CONFIG.name}" class="photo-real">`
              : `<div class="photo-placeholder"><div class="photo-icon">📸</div><div class="photo-label">Foto folgt</div></div>`
            }

          </div>
        </div>
      </div>
    </section>`;

  /* --- STATS --- */
  const statsHTML = CONFIG.stats.map(s => `
    <div class="stat">
      <div class="stat-num">${s.num}<span>${s.suffix}</span></div>
      <div class="stat-label">${s.label}</div>
    </div>`).join('');
  document.getElementById('site-stats').innerHTML =
    `<div class="stats-row reveal">${statsHTML}</div>`;

  /* --- STRIP STATS --- */
  document.getElementById('site-strip-stats').innerHTML = `
    <div class="testimonial-strip reveal">
      <blockquote>
        &#8222;${CONFIG.stimmen.zitate[3].zitat}&#8220;
        <cite>${CONFIG.stimmen.zitate[3].name} <span>· ${CONFIG.stimmen.zitate[3].rolle}</span></cite>
      </blockquote>
    </div>`;

  /* --- ABOUT --- */
  const valuesHTML = CONFIG.values.map(v => `
    <div class="value-item">
      <div class="value-icon">${v.icon}</div>
      <div class="value-content"><h4>${v.titel}</h4><p>${v.text}</p></div>
    </div>`).join('');
  document.getElementById('site-about').innerHTML = `
    <section class="section" id="about">
      <div class="about-grid reveal">
        <div class="about-text">
          <h2>${CONFIG.about.headline}</h2>
          <p>${CONFIG.about.absatz1}</p>
          <p>${CONFIG.about.absatz2}</p>
          <p>${CONFIG.about.absatz3}</p>
          <blockquote class="about-quote">
            <p>${CONFIG.about.zitat1}</p>
            <p>${CONFIG.about.zitat2}</p>
          </blockquote>
        </div>
        <div class="values-list">${valuesHTML}</div>
      </div>
    </section>
    <div class="testimonial-strip reveal">
      <blockquote>
        &#8222;${CONFIG.stimmen.zitate[1].zitat}&#8220;
        <cite>${CONFIG.stimmen.zitate[1].name} <span>· ${CONFIG.stimmen.zitate[1].rolle}</span></cite>
      </blockquote>
    </div>`;

  /* --- FÜR WEN --- */
  const forWhomHTML = CONFIG.forWhom.gruppen.map(g => `
    <div class="forwhom-card">
      <div class="forwhom-icon">${g.icon}</div>
      <div class="forwhom-content"><h4>${g.titel}</h4><p>${g.text}</p></div>
    </div>`).join('');
  document.getElementById('site-forwhom').innerHTML = `
    <section class="forwhom-section">
      <div class="section">
        <div class="reveal">
          <h2>${CONFIG.forWhom.headline}</h2>
          <p style="max-width:640px;margin:24px auto 0;font-size:17px;line-height:1.75;color:var(--ink2);text-align:center;">${CONFIG.forWhom.intro}</p>
        </div>
        <div class="forwhom-grid reveal">${forWhomHTML}</div>
      </div>
    </section>
    `;

  /* --- ANGEBOTE --- */
  document.getElementById('site-angebote').innerHTML = `
    <section class="offer-section" id="angebot">
      <div class="section">
        <div class="reveal">
          <h2>${CONFIG.angebote.headline}</h2>
          <div class="kennenlern-banner" style="margin-top:40px;">
            <p><strong>Kostenloses Erstgespräch</strong> ${CONFIG.angebote.kennenlern.text}</p>
            <a href="#" onclick="return openCalendly(event);">${CONFIG.angebote.kennenlern.btn}</a>
          </div>
        </div>
      </div>
    </section>`;

  /* --- STRIP ANGEBOTE --- */
  document.getElementById('site-strip-angebote').innerHTML = `
    <div class="testimonial-strip reveal">
      <blockquote>
        &#8222;${CONFIG.stimmen.zitate[0].zitat}&#8220;
        <cite>${CONFIG.stimmen.zitate[0].name} <span>· ${CONFIG.stimmen.zitate[0].rolle}</span></cite>
      </blockquote>
    </div>
    <div class="testimonial-strip reveal">
      <blockquote>
        &#8222;${CONFIG.stimmen.zitate[2].zitat}&#8220;
        <cite>${CONFIG.stimmen.zitate[2].name} <span>· ${CONFIG.stimmen.zitate[2].rolle}</span></cite>
      </blockquote>
    </div>
    <div class="testimonial-strip reveal">
      <blockquote>
        &#8222;${CONFIG.stimmen.zitate[4].zitat}&#8220;
        <cite>${CONFIG.stimmen.zitate[4].name} <span>· ${CONFIG.stimmen.zitate[4].rolle}</span></cite>
      </blockquote>
    </div>
    <div class="testimonial-strip reveal" style="background:var(--white);">
      <blockquote style="color:var(--ink2);">
        &#8222;Deine Erfahrung könnte hier stehen. Buche dein kostenloses Erstgespräch.&#8220;
        <cite style="color:var(--ink3);">Du? <span>· Dein nächstes Kapitel</span></cite>
      </blockquote>
    </div>`;

  /* --- STIMMEN --- */
  const zitateHTML = [CONFIG.stimmen.zitate[4]].map(z => `
    <div class="testimonial-card">
      <div class="testimonial-quote">"${z.zitat}"</div>
      <div class="testimonial-author">
        <div class="author-avatar">${z.name.charAt(0)}</div>
        <div>
          <div class="author-name">${z.name}</div>
          <div class="author-role">${z.rolle}</div>
        </div>
      </div>
    </div>`).join('');
  document.getElementById('site-stimmen').innerHTML = '';

  /* --- FAQ --- */
  document.getElementById('site-faq').innerHTML = `
    <section class="section" id="faq">
      <div class="reveal">
        <div class="section-tag" style="text-align:center;">${CONFIG.faq.tag}</div>
        <h2 style="text-align:center;">${CONFIG.faq.headline}</h2>
        <div class="faq-list">${CONFIG.faq.fragen.map(f => `
          <details class="faq-item">
            <summary>${f.frage}</summary>
            <p>${f.antwort}</p>
          </details>`).join('')}</div>
      </div>
    </section>`;

  /* --- FAQ-Daten fuer Suchmaschinen, automatisch aus CONFIG --- */
  (function () {
    var sc = document.createElement('script');
    sc.type = 'application/ld+json';
    sc.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": CONFIG.faq.fragen.map(function (f) {
        return { "@type": "Question", "name": f.frage,
                 "acceptedAnswer": { "@type": "Answer", "text": f.antwort } };
      })
    });
    document.head.appendChild(sc);
  })();

  /* --- CTA --- */
  document.getElementById('site-cta').innerHTML = `
    <section class="cta-section" id="kontakt">
      <div class="cta-box reveal">
        <div class="cta-eyebrow">${CONFIG.cta.eyebrow}</div>
        <h2>${CONFIG.cta.headline1}<br><em style="font-style:italic;">${CONFIG.cta.headline2}</em></h2>
        <p class="cta-sub">${CONFIG.cta.subtext}</p>
        <div class="cta-actions">
          <a href="#" onclick="return openCalendly(event);" class="btn-white">${CONFIG.cta.btnPrimary}</a>
          <a href="#angebot" class="btn-outline-white">${CONFIG.cta.btnSecondary}</a>
        </div>
      </div>
    </section>`;

  /* --- FOOTER --- */
  document.getElementById('site-footer').innerHTML = `
    <footer>
      <a class="footer-logo" href="#">${CONFIG.name}</a>
      <div class="footer-claim">${CONFIG.tagline}</div>
      <div class="footer-links">
        <a href="${CONFIG.footer.impressumLink}">Impressum</a>
        <a href="${CONFIG.footer.datenschutzLink}">Datenschutz</a>
      </div>
    </footer>`;

  /* --- SCROLL REVEAL --- */
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
</body>
</html>
